{% extends "base.html" %}
{% block title %}Category · lifedger{% endblock %}

{% block content %}
<h1 style="color:var(--text)" class="text-2xl font-semibold mb-6">
  {{ "Edit" if category else "Add" }} Category
</h1>

<form method="POST"
      style="background:var(--card)"
      class="p-6 rounded shadow max-w-lg space-y-4">

  <label class="block">
    <span style="color:var(--muted);" class="text-sm">Name</span>
    <input style="color:var(--text); background:var(--bg); border-color:var(--border)" type="text" name="name" required
      value="{{ category.name if category else '' }}"
      class="w-full border rounded px-3 py-2">
  </label>

  <label class="block">
    <span style="color:var(--muted);" class="text-sm">Parent category (optional)</span>
    <select style="color:var(--text); background:var(--bg); border-color:var(--border)" name="parent_id"
            class="w-full border rounded px-3 py-2">
      <option value="">— None —</option>
      {% for p in parents %}
        <option value="{{ p.id }}"
          {% if category and category.parent_id == p.id %}selected{% endif %}>
          {{ p.name }}
        </option>
      {% endfor %}
    </select>
  </label>

  <div class="flex justify-end space-x-3">
    <a style="color:var(--text); background:var(--card); border-color:var(--border)" href="{{ url_for('finance.category_list') }}"
       class="px-4 py-2 border rounded">
      Cancel
    </a>
    <button style="color:var(--card); background:var(--text); border-color:var(--border)" class="px-4 py-2 border rounded">
      Save
    </button>
  </div>
</form>
{% endblock %}
