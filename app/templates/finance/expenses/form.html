{% extends "base.html" %}
{% block title %}
  {{ "Edit" if expense else "Add" }} Expense · lifedger
{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold mb-6">
  {{ "Edit" if expense else "Add" }} Expense
</h1>

<form method="POST" class="bg-white p-6 rounded shadow max-w-lg space-y-4">

  <label class="block">
    <span class="text-sm">Category</span>
    <select name="category_id" required class="w-full border rounded px-3 py-2">
      {% for c in categories %}
        <option value="{{ c.id }}"
          {% if expense and expense.category_id == c.id %}selected{% endif %}>
          {% if c.parent %}{{ c.parent.name }} → {% endif %}
          {{ c.name }}
        </option>
      {% endfor %}
    </select>
  </label>

  <label class="block">
    <span class="text-sm">Amount</span>
    <input type="number" step="0.01" name="amount" required
      value="{{ expense.amount if expense else '' }}"
      class="w-full border rounded px-3 py-2">
  </label>

  <label class="block">
    <span class="text-sm">Date</span>
    <input type="date" name="date" required
      value="{{ today }}"
      class="w-full border rounded px-3 py-2">
  </label>

  <label class="block">
    <span class="text-sm">Merchant</span>
    <input type="text" name="merchant"
      value="{{ expense.merchant if expense else '' }}"
      class="w-full border rounded px-3 py-2">
  </label>

  <label class="block">
    <span class="text-sm">Payment method</span>
    <input type="text" name="payment_method"
      value="{{ expense.payment_method if expense else '' }}"
      class="w-full border rounded px-3 py-2">
  </label>

  <label class="block">
    <span class="text-sm">Description</span>
    <input type="text" name="description"
      value="{{ expense.description if expense else '' }}"
      class="w-full border rounded px-3 py-2">
  </label>

  <div class="flex justify-end space-x-3">
    <a href="{{ url_for('finance.expense_list') }}"
       class="px-4 py-2 border rounded">
      Cancel
    </a>
    <button class="px-4 py-2 bg-black text-white rounded">
      Save
    </button>
  </div>
</form>
{% endblock %}
