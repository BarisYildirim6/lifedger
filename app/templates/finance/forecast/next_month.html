{% extends "base.html" %}
{% block title %}Forecast · lifedger{% endblock %}

{% block content %}
<div class="bg-white p-6 rounded shadow">
  <h2 class="text-xl font-semibold mb-2">Next Month Forecast</h2>

  <p class="text-3xl font-bold">
    {{ forecast.forecast }}
  </p>

  <p class="text-sm text-gray-500">
    Expected range: {{ forecast.low }} – {{ forecast.high }}
  </p>
</div>

<div class="mt-4 bg-white p-4 rounded shadow space-y-2">
  {% for insight in insights %}
    <p>• {{ insight }}</p>
  {% endfor %}
</div>
{% endblock %}
