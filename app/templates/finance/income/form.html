{% extends "base.html" %}
{% block title %}Income · lifedger{% endblock %}

{% block content %}
<h1 style="color:var(--text)" class="text-2xl font-semibold mb-6">
  {{ "Edit" if income else "Add" }} Income
</h1>

<form method="POST" style="background:var(--card)" class="p-6 rounded shadow max-w-lg space-y-4">

  <label class="block">
    <span style="color:var(--muted);" class="text-sm">Source</span>
    <input style="color:var(--text); background:var(--bg); border-color:var(--border)" type="text" name="source" required
      value="{{ income.source if income else '' }}"
      class="w-full border rounded px-3 py-2">
  </label>

  <label class="block">
    <span style="color:var(--muted);" class="text-sm">Amount</span>
    <input style="color:var(--text); background:var(--bg); border-color:var(--border)" type="number" step="0.01" name="amount" required
      value="{{ income.amount if income else '' }}"
      class="w-full border rounded px-3 py-2">
  </label>

  <label class="block">
    <span style="color:var(--muted);" class="text-sm">Date</span>
    <input style="color:var(--text); background:var(--bg); border-color:var(--border)" type="date" name="date" required
      value="{{ income.date if income else '' }}"
      class="w-full border rounded px-3 py-2">
  </label>

  <label class="flex items-center space-x-2">
    <input style="color:var(--text);" type="checkbox" name="is_recurring"
      {% if income and income.is_recurring %}checked{% endif %}>
    <span>Recurring</span>
  </label>

  <div class="flex justify-end space-x-3">
    <a style="color:var(--text); background:var(--card); border-color:var(--border)" href="{{ url_for('finance.income_list') }}"
       class="px-4 py-2 border rounded">
      Cancel
    </a>
    <button style="color:var(--card); background:var(--text); border-color:var(--border)" class="px-4 py-2 rounded">
      Save
    </button>
  </div>
</form>
{% endblock %}
