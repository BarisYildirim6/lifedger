{% extends "base.html" %}
{% block title %}Income · lifedger{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold mb-6">
  {{ "Edit" if income else "Add" }} Income
</h1>

<form method="POST" class="bg-white p-6 rounded shadow max-w-lg space-y-4">

  <label class="block">
    <span class="text-sm">Source</span>
    <input type="text" name="source" required
      value="{{ income.source if income else '' }}"
      class="w-full border rounded px-3 py-2">
  </label>

  <label class="block">
    <span class="text-sm">Amount</span>
    <input type="number" step="0.01" name="amount" required
      value="{{ income.amount if income else '' }}"
      class="w-full border rounded px-3 py-2">
  </label>

  <label class="block">
    <span class="text-sm">Date</span>
    <input type="date" name="date" required
      value="{{ income.date if income else '' }}"
      class="w-full border rounded px-3 py-2">
  </label>

  <label class="flex items-center space-x-2">
    <input type="checkbox" name="is_recurring"
      {% if income and income.is_recurring %}checked{% endif %}>
    <span>Recurring</span>
  </label>

  <div class="flex justify-end space-x-3">
    <a href="{{ url_for('finance.income_list') }}"
       class="px-4 py-2 border rounded">
      Cancel
    </a>
    <button class="px-4 py-2 bg-black text-white rounded">
      Save
    </button>
  </div>
</form>
{% endblock %}
