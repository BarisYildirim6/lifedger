{% extends "base.html" %}
{% block title %}Recurring · lifedger{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold mb-6">
  {{ "Edit" if item else "Add" }} Recurring Transaction
</h1>

<form method="POST"
      class="bg-white p-6 rounded shadow max-w-xl space-y-5">

  <!-- Active toggle -->
  <label class="flex items-center space-x-3">
    <input type="checkbox"
           name="is_active"
           id="is_active"
           value="1"
           {% if not item or item.is_active %}checked{% endif %}
           class="h-4 w-4 rounded border-gray-300">
    <span class="text-sm font-medium">
      Active (repeats every month until disabled)
    </span>
  </label>

  <hr>

  <label class="block">
    <span class="text-sm">Type</span>
    <select name="type" required
            class="w-full border rounded px-3 py-2">
      <option value="expense"
        {% if item and item.type == "expense" %}selected{% endif %}>
        Expense
      </option>
      <option value="income"
        {% if item and item.type == "income" %}selected{% endif %}>
        Income
      </option>
    </select>
  </label>

  <label class="block">
    <span class="text-sm">Amount</span>
    <input type="number" step="0.01" name="amount" required
           value="{{ item.amount if item else '' }}"
           class="w-full border rounded px-3 py-2">
  </label>

  <label class="block">
    <span class="text-sm">Description</span>
    <input type="text" name="description"
           value="{{ item.description if item else '' }}"
           class="w-full border rounded px-3 py-2">
  </label>

  <label class="block">
    <span class="text-sm">Category (expenses only)</span>
    <select name="category_id"
            class="w-full border rounded px-3 py-2">
      <option value="">— None —</option>
      {% for c in categories %}
        <option value="{{ c.id }}"
          {% if item and item.category_id == c.id %}selected{% endif %}>
          {% if c.parent %}{{ c.parent.name }} → {% endif %}
          {{ c.name }}
        </option>
      {% endfor %}
    </select>
  </label>

  <div class="grid grid-cols-2 gap-4">
    <label class="block">
      <span class="text-sm">Start date</span>
      <input type="date" name="start_date" required
             value="{{ item.start_date if item else '' }}"
             class="w-full border rounded px-3 py-2">
    </label>

    <label class="block">
      <span class="text-sm">End date</span>
      <input type="date"
             name="end_date"
             id="end_date"
             value="{{ item.end_date if item else '' }}"
             class="w-full border rounded px-3 py-2">
      <p class="text-xs text-gray-500 mt-1">
        Leave empty if recurring indefinitely
      </p>
    </label>
  </div>

  <label class="block">
    <span class="text-sm">Day of month</span>
    <input type="number" name="day_of_month"
           min="1" max="28" required
           value="{{ item.day_of_month if item else 1 }}"
           class="w-full border rounded px-3 py-2">
  </label>

  <div class="flex justify-end space-x-3 pt-4">
    <a href="{{ url_for('finance.recurring_list') }}"
       class="px-4 py-2 border rounded">
      Cancel
    </a>
    <button class="px-4 py-2 bg-black text-white rounded">
      Save
    </button>
  </div>
</form>

<!-- Minimal JS: end date enable/disable -->
<script>
  const activeCheckbox = document.getElementById("is_active");
  const endDateInput = document.getElementById("end_date");

  function syncEndDateState() {
    if (activeCheckbox.checked) {
      endDateInput.disabled = true;
      endDateInput.classList.add("bg-gray-100");
      endDateInput.value = "";
    } else {
      endDateInput.disabled = false;
      endDateInput.classList.remove("bg-gray-100");
    }
  }

  activeCheckbox.addEventListener("change", syncEndDateState);
  syncEndDateState();
</script>
{% endblock %}
