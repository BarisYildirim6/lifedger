{% extends "base.html" %}
{% block title %}Scan Expense · lifedger{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">

  <h1 class="text-2xl font-semibold mb-2">
    Scan bill or invoice
  </h1>

  <p class="text-gray-600 mb-6">
    Upload a photo or PDF. We’ll extract the amount, date and merchant
    for you.
  </p>

  {% if error %}
    <div class="bg-red-50 text-red-700 p-3 rounded mb-4">
      {{ error }}
    </div>
  {% endif %}

  <form method="post"
        enctype="multipart/form-data"
        class="bg-white shadow rounded-lg p-6 space-y-4">

    <label class="block">
      <span class="text-sm font-medium text-gray-700">
        Bill / Invoice file
      </span>

      <input type="file"
             name="file"
             accept="image/*,.pdf"
             capture="environment"
             required
             class="mt-2 block w-full text-sm
                    file:mr-4 file:py-2 file:px-4
                    file:rounded file:border-0
                    file:bg-black file:text-white
                    hover:file:bg-gray-800">
    </label>

    <div class="flex justify-between items-center pt-4">
      <a href="{{ url_for('finance.expense_list') }}"
         class="text-gray-600 hover:underline">
        ← Back to expenses
      </a>

      <button type="submit"
              class="bg-black text-white px-6 py-2 rounded">
        Scan
      </button>
    </div>

  </form>
</div>
{% endblock %}
