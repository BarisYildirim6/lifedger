services:
  web:
    build:
      context: .
      dockerfile: docker/flask/Dockerfile
    container_name: lifedger_web
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: lifedger_db
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting
      POSTGRES_DB: accounting
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  worker:
    image: lifedger-web
    container_name: lifedger_worker
    command: cron -f
    env_file: .env
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
